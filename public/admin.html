<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Russian Loto -- Админка</title>
<script src="/static/js/theme-boot.js"></script>
<link rel="stylesheet" href="/static/css/base.css">
<link rel="stylesheet" href="/static/css/admin.css">
</head>
<body>

<header class="admin-header">
  <div class="admin-title">
    <h1>Игры</h1>
    <span class="admin-count" id="game-count"></span>
  </div>
  <div class="admin-actions">
    <label class="toggle">
      <span>Только активные</span>
      <input type="checkbox" id="active-only" class="switch" checked>
    </label>
    <a class="refresh-btn" href="/admin/stats">Статистика</a>
    <button type="button" class="refresh-btn" id="refresh-btn">Обновить</button>
  </div>
</header>

<p class="admin-error hidden" id="error" role="alert" aria-live="polite"></p>

<main class="admin-main">
  <p class="admin-empty hidden" id="empty">Активных игр нет.</p>
  <div class="game-list" id="game-list"></div>
</main>

<div class="modal-backdrop" id="confirm-delete">
  <div class="modal">
    <p class="modal-title">Удалить игру <span id="confirm-delete-id"></span>?</p>
    <p class="modal-text">
      Игра и её статистика будут стёрты без возможности вернуть. Ссылка на
      сессию перестанет открываться.
    </p>
    <p class="modal-warning hidden" id="confirm-delete-live">
      Эта игра идёт прямо сейчас. У ведущего и на табло страница перестанет
      работать.
    </p>
    <div class="modal-actions">
      <button type="button" class="btn-cancel" data-action="cancel">Отмена</button>
      <button type="button" class="btn-danger" data-action="confirm">Удалить</button>
    </div>
  </div>
</div>

<script type="module" src="/static/js/main-admin.js"></script>

</body>
</html>
