<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Russian Loto -- Админка</title>
<link rel="stylesheet" href="/static/css/base.css">
<link rel="stylesheet" href="/static/css/admin.css">
</head>
<body>

<header class="admin-header">
  <div class="admin-title">
    <h1>Игры</h1>
    <span class="admin-count" id="game-count"></span>
  </div>
  <div class="admin-actions">
    <label class="toggle">
      <input type="checkbox" id="active-only" checked>
      <span>Только активные</span>
    </label>
    <button type="button" class="refresh-btn" id="refresh-btn">Обновить</button>
  </div>
</header>

<p class="admin-error hidden" id="error" role="alert" aria-live="polite"></p>

<main class="admin-main">
  <p class="admin-empty hidden" id="empty">Активных игр нет.</p>
  <div class="game-list" id="game-list"></div>
</main>

<script type="module" src="/static/js/main-admin.js"></script>

</body>
</html>
