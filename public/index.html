<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1a1a1a">
<title>Russian Loto</title>
<link rel="stylesheet" href="/static/css/base.css">
<link rel="stylesheet" href="/static/css/landing.css">
</head>
<body>

<main class="landing">
  <h1>Русское лото</h1>
  <p class="subtitle">Live-игра для ведущего, табло для игроков.</p>

  <section class="actions">
    <button id="new-default-btn" class="action-btn primary">
      Новая игра
      <span class="hint">с дефолтной колодой</span>
    </button>

    <label for="custom-cards-input" class="action-btn secondary">
      Загрузить свою колоду
      <span class="hint">JSON из russian-loto CLI</span>
    </label>
    <input id="custom-cards-input" type="file" accept="application/json" hidden>
  </section>

  <p class="error hidden" id="error"></p>
</main>

<script type="module" src="/static/js/landing.js"></script>

</body>
</html>
