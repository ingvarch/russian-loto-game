<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#000000">
<title>Russian Loto -- Display</title>
<script src="/static/js/theme-boot.js"></script>
<link rel="manifest" href="/manifest.webmanifest">
<link rel="apple-touch-icon" href="/static/img/icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Лото">
<meta name="mobile-web-app-capable" content="yes">
<link rel="stylesheet" href="/static/css/base.css">
<link rel="stylesheet" href="/static/css/display.css">
</head>
<body class="has-tabbar">

<header>
  <div class="counter">
    <span id="counter-called">0</span><span class="total">/90</span>
  </div>
  <div class="header-right">
    <div class="status" id="status">connecting...</div>
    <div class="session-clock hidden" id="session-clock">0:00</div>
    <button type="button" class="share-btn" id="share-display-btn"
            aria-label="Ссылка и QR-код на табло" title="Ссылка и QR-код на табло">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none"
             stroke="currentColor" stroke-width="1.75" stroke-linecap="round"
             stroke-linejoin="round" aria-hidden="true">
          <rect width="5" height="5" x="3" y="3" rx="1" />
          <rect width="5" height="5" x="16" y="3" rx="1" />
          <rect width="5" height="5" x="3" y="16" rx="1" />
          <path d="M21 16h-3a2 2 0 0 0-2 2v3" />
          <path d="M21 21v.01" />
          <path d="M12 7v3a2 2 0 0 1-2 2H7" />
          <path d="M3 12h.01" />
          <path d="M12 3h.01" />
          <path d="M12 16v.01" />
          <path d="M16 12h1" />
          <path d="M21 12v.01" />
          <path d="M12 21v-1" />
        </svg>
    </button>
  </div>
</header>

<main>
  <div class="grid-wrap">
    <div class="grid" id="number-grid"></div>
  </div>

  <div class="sidebar">
    <section class="current-section">
      <div class="section-title">Последний</div>
      <div class="current-ball empty" id="current-ball">
        <span class="current-num" id="current-num">&mdash;</span>
      </div>
    </section>

    <section class="recent-section">
      <div class="section-title">5 предыдущих</div>
      <div class="recent-list" id="recent-list"></div>
    </section>

    <section class="winners-section hidden" id="winners-section">
      <div class="section-title">Победители</div>
      <div class="winners-list">
        <div class="winner-row level-1 hidden" id="winner-1">
          <span class="winner-label">одна линия</span>
          <span class="winner-seq">&mdash;</span>
        </div>
        <div class="winner-row level-2 hidden" id="winner-2">
          <span class="winner-label">две линии</span>
          <span class="winner-seq">&mdash;</span>
        </div>
        <div class="winner-row level-3 hidden" id="winner-3">
          <span class="winner-label">полное лото</span>
          <span class="winner-seq">&mdash;</span>
        </div>
      </div>
    </section>

    <section class="prize-section hidden" id="prize-section">
      <div class="section-title">Банк</div>
      <div class="prize-total" id="prize-total">0</div>
      <div class="prize-levels">
        <div class="prize-row level-1">
          <span class="prize-label">одна линия</span>
          <span class="prize-amount" id="prize-1">0</span>
        </div>
        <div class="prize-row level-2">
          <span class="prize-label">две линии</span>
          <span class="prize-amount" id="prize-2">0</span>
        </div>
        <div class="prize-row level-3">
          <span class="prize-label">полное лото</span>
          <span class="prize-amount" id="prize-3">0</span>
        </div>
      </div>
    </section>

  </div>
</main>

<div class="egg-layer" id="egg-layer" aria-hidden="true"></div>

<div class="win-overlay" id="music-overlay" aria-hidden="true">
  <div class="win-card">
    <div class="music-emoji">&#127925; &#128266; &#127926;</div>
    <div class="win-title">Музыкальная пауза!</div>
  </div>
</div>

<div class="win-overlay" id="win-overlay" aria-hidden="true">
  <div class="win-card">
    <div class="win-title">Полное лото!</div>
    <div class="win-subtitle">Карта</div>
    <div class="win-seq" id="win-seq">&numero; 000</div>
  </div>
</div>

<nav class="tabbar" aria-label="Разделы">
  <a class="tab is-current" href="./display" aria-label="Табло" aria-current="page">
    <svg width="26" height="26" viewBox="0 0 24 24" fill="none"
         stroke="currentColor" stroke-width="1.75" stroke-linecap="round"
         stroke-linejoin="round" aria-hidden="true">
      <rect width="20" height="14" x="2" y="3" rx="2" />
      <line x1="8" x2="16" y1="21" y2="21" />
      <line x1="12" x2="12" y1="17" y2="21" />
    </svg>
  </a>
  <a class="tab" href="./" aria-label="Игра">
    <svg width="26" height="26" viewBox="0 0 24 24" fill="none"
         stroke="currentColor" stroke-width="1.75" stroke-linecap="round"
         stroke-linejoin="round" aria-hidden="true">
      <line x1="6" x2="10" y1="11" y2="11" />
      <line x1="8" x2="8" y1="9" y2="13" />
      <line x1="15" x2="15.01" y1="12" y2="12" />
      <line x1="18" x2="18.01" y1="10" y2="10" />
      <path d="M17.32 5H6.68a4 4 0 0 0-3.978 3.59c-.006.052-.01.101-.017.152C2.604 9.416 2 14.456 2 16a3 3 0 0 0 3 3c1 0 1.5-.5 2-1l1.414-1.414A2 2 0 0 1 9.828 16h4.344a2 2 0 0 1 1.414.586L17 18c.5.5 1 1 2 1a3 3 0 0 0 3-3c0-1.545-.604-6.584-.685-7.258-.007-.05-.011-.1-.017-.151A4 4 0 0 0 17.32 5z" />
    </svg>
  </a>
  <a class="tab" href="./settings" aria-label="Настройки">
    <svg width="26" height="26" viewBox="0 0 24 24" fill="none"
         stroke="currentColor" stroke-width="1.75" stroke-linecap="round"
         stroke-linejoin="round" aria-hidden="true">
      <path d="M9.671 4.136a2.34 2.34 0 0 1 4.659 0 2.34 2.34 0 0 0 3.319 1.915 2.34 2.34 0 0 1 2.33 4.033 2.34 2.34 0 0 0 0 3.831 2.34 2.34 0 0 1-2.33 4.033 2.34 2.34 0 0 0-3.319 1.915 2.34 2.34 0 0 1-4.659 0 2.34 2.34 0 0 0-3.32-1.915 2.34 2.34 0 0 1-2.33-4.033 2.34 2.34 0 0 0 0-3.831A2.34 2.34 0 0 1 6.35 6.051a2.34 2.34 0 0 0 3.319-1.915" />
      <circle cx="12" cy="12" r="3" />
    </svg>
  </a>
</nav>

<script type="application/json" id="cards-data">{{CARDS_JSON}}</script>

<script type="module" src="/static/js/main-display.js"></script>

</body>
</html>
