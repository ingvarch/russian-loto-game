# Source of truth for deployment. Do not edit these in the dashboard —
# the next deploy overwrites them.

name = "russian-loto-game"
main = "src/index.ts"
# Pinned to the newest date the bundled workerd supports. Bump alongside
# the wrangler/pool-workers upgrade, not on its own.
compatibility_date = "2025-09-06"
workers_dev = true
# Worker bundle only. Client JS under public/ ships unminified as ES
# modules — the assets binding serves it verbatim, no build step.
minify = true

[[routes]]
pattern = "loto.1ly.dev"
custom_domain = true

# `/admin/*` needs the literal slash, so bare `/admin` and `/admin.html`
# are listed too — otherwise html_handling serves the shell straight from
# assets and the password prompt never appears.
[assets]
directory = "./public"
binding = "ASSETS"
html_handling = "auto-trailing-slash"
not_found_handling = "404-page"
run_worker_first = ["/api/*", "/s/*", "/admin", "/admin/*", "/admin.html"]

# Optional in src/types.ts: unbound (tests, local dev) just skips the check.
[[ratelimits]]
name = "SESSION_RATE_LIMITER"
namespace_id = "1001"
simple = { limit = 60, period = 60 }

# Session mirror + game statistics. The Worker writes it; GameRoom does
# not, keeping game state opaque to the DO.
[[d1_databases]]
binding = "DB"
database_name = "russian-loto-db"
database_id = "2ee69f1f-ff0c-423c-8f33-95a5973860ed"
migrations_dir = "migrations"

# Sample everything: traffic is a handful of games, and the one thing we
# need in the dashboard is the rare failed D1 mirror write, which sampling
# would drop.
[observability]
enabled = true
head_sampling_rate = 1

[observability.logs]
enabled = true
invocation_logs = true
head_sampling_rate = 1

# One GameRoom per session: authoritative state + SSE subscribers.
[[durable_objects.bindings]]
name = "GAME_ROOM"
class_name = "GameRoom"

# Never edit an applied migration; add a new tag.
[[migrations]]
tag = "v1"
new_sqlite_classes = ["GameRoom"]

# Bindings are not inherited by an environment — everything below is
# re-declared on purpose.
[env.staging]
name = "russian-loto-game-staging"
workers_dev = true

[[env.staging.durable_objects.bindings]]
name = "GAME_ROOM"
class_name = "GameRoom"

# Own namespace so staging traffic doesn't spend production's budget.
[[env.staging.ratelimits]]
name = "SESSION_RATE_LIMITER"
namespace_id = "1002"
simple = { limit = 60, period = 60 }

[[env.staging.migrations]]
tag = "v1"
new_sqlite_classes = ["GameRoom"]

# Shares production's database, so staging games pollute the statistics.
# Before staging sees real use: wrangler d1 create russian-loto-db-staging
# Secrets are per-environment: wrangler secret put ADMIN_PASSWORD --env staging
[[env.staging.d1_databases]]
binding = "DB"
database_name = "russian-loto-db"
database_id = "2ee69f1f-ff0c-423c-8f33-95a5973860ed"
migrations_dir = "migrations"
